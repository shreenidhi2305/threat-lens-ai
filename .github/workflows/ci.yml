name: CI

# Free for GitHub repositories. Builds and tests everything, then builds the two production
# Docker images and smoke-tests the whole stack (nginx -> API -> ML model) end to end.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend
        env:
          PYTHONPATH: .

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    name: Docker images and stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create a demo .env
        run: |
          out=$(python deploy/make_env.py --demo)
          echo "$out" | sed 's/Demo sign-in password: .*/Demo sign-in password: ***/'
          echo "DEMO_PASSWORD=$(echo "$out" | sed -n 's/^Demo sign-in password: //p')" >> "$GITHUB_ENV"

      - name: Build images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for it to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "stack did not become healthy"; docker compose ps; docker compose logs; exit 1

      - name: Security headers are served by nginx
        run: |
          headers=$(curl -fsSI http://localhost:8080/)
          echo "$headers"
          echo "$headers" | grep -qi '^content-security-policy:'
          echo "$headers" | grep -qi '^x-frame-options: DENY'
          curl -fsS -o /dev/null -w "SPA fallback: %{http_code}\n" http://localhost:8080/alerts

      - name: ML model loaded in the image (libgomp present)
        run: |
          pip install requests
          python - <<'PY'
          import os, sys, requests
          api = "http://localhost:8080/api/v1"
          token = requests.post(f"{api}/auth/login",
                                json={"email": "analyst@local", "password": os.environ["DEMO_PASSWORD"]},
                                timeout=15).json()["access_token"]
          info = requests.get(f"{api}/malware/model", headers={"Authorization": f"Bearer {token}"}, timeout=15).json()
          print(info.get("detector"))
          if not info.get("detector"):
              sys.exit("ML detector did not load inside the container")
          PY

      - name: End-to-end demo against the container stack
        run: python demo/m4_end_to_end_demo.py --skip-real --api http://localhost:8080/api/v1 --password "$DEMO_PASSWORD"

      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v

  space:
    name: Hugging Face Space image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the Space folder and build the image
        run: |
          python deploy/huggingface/prepare.py --out "$RUNNER_TEMP/space" > /dev/null
          docker build -t threatlens-space "$RUNNER_TEMP/space"

      - name: Run it like the Space does
        run: |
          docker run -d --name tl -p 7860:7860             -e JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"             -e DEV_LOGIN_PASSWORD=ci-space-password-123             threatlens-space
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:7860/health >/dev/null 2>&1; then echo "healthy after ${i}s"; break; fi
            sleep 1
          done
          curl -fsS http://localhost:7860/health

      - name: UI, sign-in gate, ML model and seeded data
        run: |
          pip install requests
          python - <<'PY'
          import sys, time, requests
          base = "http://localhost:7860"
          assert "<div id=\"root\">" in requests.get(base + "/alerts", timeout=15).text, "UI shell not served"
          assert requests.post(base + "/api/v1/auth/login", json={"email": "admin@local", "password": "wrong"}, timeout=15).status_code == 401
          token = requests.post(base + "/api/v1/auth/login", json={"email": "admin@local", "password": "ci-space-password-123"}, timeout=15).json()["access_token"]
          h = {"Authorization": "Bearer " + token}
          if not requests.get(base + "/api/v1/malware/model", headers=h, timeout=15).json().get("detector"):
              sys.exit("ML detector did not load inside the container")
          for _ in range(60):
              stats = requests.get(base + "/api/v1/threats/stats", headers=h, timeout=15).json()
              if stats["total_detections"] >= 8:
                  break
              time.sleep(1)
          print(stats)
          assert stats["total_detections"] >= 8 and stats["malicious"] >= 3, "demo data was not seeded"
          PY

      - name: Logs on failure
        if: failure()
        run: docker logs tl --tail 200

  publish:
    name: Publish images to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: api
            context: ./backend
          - name: web
            context: ./frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=latest
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
