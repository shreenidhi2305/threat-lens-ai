services:
  backend:
    build:
      context: ./backend
    container_name: threatlens-backend
    env_file:
      - .env
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ./frontend
    container_name: threatlens-frontend
    env_file:
      - .env
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    ports:
      - '5173:5173'
    depends_on:
      - backend
