# Serves the built SPA and proxies the API, so the browser only ever talks to one origin.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resolve the backend through Docker's DNS so the proxy survives a backend restart.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. The CSP allows only our own scripts/API plus Google Fonts (index.html).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # API: uploads can be large and scans can be slow.
    location /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 260m;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        access_log off;
    }

    # Hashed build output never changes, so cache it hard.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths fall back to index.html; never cache the shell.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }
}
